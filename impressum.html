<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum</title>
<style>
  :root {
    --bg: #0f0d17; --card: #181425; --border: #2c2640;
    --text: #f1eefb; --text-dim: #a99fc4; --accent: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    line-height: 1.6; padding: 48px 20px;
  }
  .box {
    max-width: 560px; margin: 0 auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 20px; padding: 40px;
  }
  h1 { font-size: 28px; margin-bottom: 24px; }
  p { color: var(--text-dim); font-size: 15px; margin-bottom: 16px; }
  p strong, .value { color: var(--text); }
  a { color: var(--accent); }
  .back { display: inline-block; margin-top: 24px; font-size: 14px; }
</style>
</head>
<body>
  <div class="box">
    <h1>Impressum</h1>
    <p>Angaben gemäß § 5 DDG:</p>
    <p class="value">Mirko Ginzel<br>Berliner Str. 6<br>55444 Waldlaubersheim</p>
    <p><strong>Kontakt:</strong><br>E-Mail: <span class="value">info-web3.baukasten@gmx.de</span></p>
    <p><strong>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV:</strong><br>Mirko Ginzel (Anschrift wie oben)</p>
    <a class="back" href="./">← zurück zur Übersicht</a>
  </div>
</body>
</html>
