<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web3 Baukästen — Links</title>
<style>
  :root {
    --bg: #0f0d17; --card: #181425; --border: #2c2640;
    --text: #f1eefb; --text-dim: #a99fc4; --accent: #8b5cf6; --accent-2: #d946ef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 56px 20px; text-align: center;
  }
  .avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 36px; }

  .links { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  a.link-btn {
    display: block; text-decoration: none; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 22px; font-weight: 600; font-size: 15px;
    transition: all .15s ease;
  }
  a.link-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  a.link-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #14091f;
  }
  a.link-btn .desc { display: block; font-weight: 400; font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }
  a.link-btn.primary .desc { color: #2a1a3d; }

  .legal-row { display: flex; gap: 12px; margin-top: 8px; }
  .legal-row a.link-btn { flex: 1; padding: 14px 16px; font-size: 13px; text-align: center; }

  footer { margin-top: 48px; color: var(--text-dim); font-size: 11px; opacity: 0.6; }
</style>
</head>
<body>
  <div class="avatar"></div>
  <h1>Web3 Baukästen</h1>
  <p class="sub">Kostenlose Landingpage-Vorlagen für DeFi & DAO Projekte</p>

  <div class="links">
    <a class="link-btn primary" href="shop/">
      🎁 Kostenlose Baukästen herunterladen
      <span class="desc">Vaultis (DeFi) & Meridian (DAO) — sofort startklar</span>
    </a>
    <a class="link-btn" href="shop/">
      💜 Freiwillig spenden
      <span class="desc">Wallet & PayPal auf der Download-Seite</span>
    </a>

    <div class="legal-row">
      <a class="link-btn" href="impressum.html">📜 Impressum</a>
      <a class="link-btn" href="datenschutz.html">🔒 Datenschutz</a>
    </div>
  </div>

  <footer>Mirko Ginzel · Web3 Baukästen</footer>
</body>
</html>
